[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "entityextract-thesis"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["Flask>=3.1,<4", "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "torch>=2.6,<3", "transformers>=4.51,<6", "safetensors>=0.5,<1", "matplotlib>=3.10,<4"]
[tool.setuptools]
packages = ["entityextract"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
